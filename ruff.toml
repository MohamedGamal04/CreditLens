# Root ruff config so files outside backend/ (e.g. scripts/) lint with the same rules
# as the backend package (whose config lives in backend/pyproject.toml).
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "*.ipynb"]

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
